image:
  repository: 11notes/keycloak
  tag: "26.7.1"
  pullPolicy: IfNotPresent

replicaCount: 1
nameOverride: ""
fullnameOverride: ""
timezone: "Europe/Zurich"

keycloak:
  fqdn: "ztna.domain.com"
  existingSecret: ""
  existingSecretKey: "KEYCLOAK_PASSWORD"

postgres:
  serviceName: "postgres"
  existingSecret: ""
  existingSecretKey: "POSTGRES_PASSWORD"

extraEnv: []

service:
  type: ClusterIP
  port: 8080
  annotations: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"

containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

tmpfs:
  tmp:
    sizeLimit: ""

readinessProbe:
  exec:
    command:
      - localhealth
      - http://127.0.0.1:9000/metrics
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  exec:
    command:
      - localhealth
      - http://127.0.0.1:9000/metrics
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6